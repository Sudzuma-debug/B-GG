# https://render.com Blueprint — optional
services:
  - type: web
    name: mini-app-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: PORT
        value: 10000
